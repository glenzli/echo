[package]
name = "echo-desktop-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The Qt executable links the static archive directly; keep the rlib for
# future Rust consumers and crate-level tests.
crate-type = ["rlib", "staticlib"]

[dependencies]
cxx.workspace = true
echo-ai.workspace = true
echo-bridge.workspace = true
echo-cache.workspace = true
echo-catalog.workspace = true
echo-core.workspace = true
echo-domain.workspace = true
echo-ir.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[build-dependencies]
cxx-build = "=1.0.198"

# CXX requires an `unsafe extern "C++"` declaration in this crate root. The
# rest of the workspace still forbids unsafe code.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
